name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The dataset is not committed, but the model artifact is, so the contract
      # and calibration tests run for real here rather than skipping.
      - name: Run tests
        run: pytest tests/ -v

      - name: Check the app imports cleanly
        run: python -c "import ast, sys; ast.parse(open('app.py', encoding='utf-8').read()); print('app.py parses')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      # Scoped to the code this PR introduces or rewrites. The older report-style
      # scripts are left alone deliberately -- reformatting them wholesale would
      # bury the substantive changes in whitespace noise. Widen this as those
      # scripts get touched.
      - name: Format check
        run: ruff format --check src tests app.py scripts/calibrate_model.py
